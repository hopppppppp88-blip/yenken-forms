<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元科表單</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="元科表單">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1416">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#0B1416}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0B1416}
  .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#C9D3D6;font-family:"Noto Sans TC","PingFang TC",sans-serif}
  .boot img{width:96px;height:96px;border-radius:22px}
</style>
</head>
<body>
<div class="boot" id="boot"><img src="apple-touch-icon.png" alt=""><div>元科表單 載入中…</div></div>
<script>
  // 表單 App 的網址（Apps Script 部署網址，結尾是 /exec）
  const APP_URL = "https://script.google.com/macros/s/AKfycbzm_iCq7EAj0cqxvLmpdfUBgxLDmLe_jd8W9f3y8ufnGsqv2_jtv2FPpTv2QHNw-Rv94g/exec";
  const f = document.createElement("iframe");
  f.src = APP_URL;
  f.allow = "camera; clipboard-write";
  f.onload = () => { const b = document.getElementById("boot"); if (b) b.remove(); };
  document.body.appendChild(f);
  // 記住登入：姓名、登入碼存在本網域，手機重開不用再登入
  const KEY = "yk_cred";
  const APP_ORIGIN = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;
  window.addEventListener("message", e => {
    if (!APP_ORIGIN.test(e.origin) || !e.data) return;
    if (e.data.ykGet) {
      let c = null; try { c = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (err) {}
      e.source.postMessage({ ykCred: c }, e.origin);
    }
    if ("ykSave" in e.data) {
      try { if (e.data.ykSave) localStorage.setItem(KEY, JSON.stringify(e.data.ykSave)); else localStorage.removeItem(KEY); } catch (err) {}
    }
  });
</script>
</body>
</html>
